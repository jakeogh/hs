[project]
name = "hs"
version = "1!0.0.1793592899"
description = "Python subprocess launching: a fork of sh with a mutating bake"
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE.txt"]
requires-python = ">=3.12"
authors = [{ name = "Andrew Moffat", email = "arwmoffat@gmail.com" }]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/jakeogh/hs"
Upstream = "https://github.com/amoffat/sh"

[tool.poetry.group.dev.dependencies]
pytest = ">=8"
pytest-randomly = ">=3"
pylint = ">=3"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
